<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Sitelen Pona writing</title>
    
    <script>
        fetch('/hazun_test/templates/head.html')
            .then(res => res.text())
            .then(html => {
                document.head.insertAdjacentHTML('beforeend', html);
            })
            .catch(err => console.error('Lỗi tải bảo mật:', err));
    </script>
</head>
<body>
    <header role="banner">
        <div id="menu"></div>
        <div id="clock"></div>
        <div id="chat"></div>
    </header>

    <main role="main">
        <h1>Toki a</h1>
        <style>

        #craftype {
            font-family: "Craftype";
        }

        #fairfax {
            font-family: "Fairfax Pona HD";
        }
        </style>

        <div style="background: #e8f4fd; padding: 20px; border-radius: 10px; margin: 20px 0;">
            <label for="craftype" style="font-weight: bold;">📝 Craftype:</label>
            <textarea id="craftype" rows="4" placeholder="Viết gì đó ở đây..." 
            style="width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #3498db; font-size: 16px;"></textarea>
        </div>

        <div style="background: #e8f4fd; padding: 20px; border-radius: 10px; margin: 20px 0;">
            <label for="fairfax" style="font-weight: bold;">📝 Fairfax Pona HD:</label>
            <textarea id="fairfax" rows="4" placeholder="Viết gì đó ở đây..." 
            style="width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #3498db; font-size: 16px;"></textarea>
        </div>    
    </main>

    <footer role="contentinfo">
        <button class="pdf-btn" onclick="window.print()">📄 Lưu trang này thành PDF</button>
    </footer>

    <script src="templates/load.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadTemplate('menu', 'menu.html');
            loadTemplate('clock', 'clock.html');
            loadTemplate('chat', 'chat.html');
        });
    </script>
</body>
</html>
